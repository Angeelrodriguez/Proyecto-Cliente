<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="CSS/styles.css">
  <!-- <script src="js/signin.js" defer></script> -->
</head>
<body>

  <header class="site-header">
    <strong class="brand">SIGN IN / SIGN UP</strong>
    <nav class="site-nav" aria-label="Principal">
      <a href="signin.html" aria-current="page">Iniciar sesión</a>
      <a href="signup.html">Crear cuenta</a>
    </nav>
  </header>

  <main class="page">
    <section class="card">
      <div class="card__header">
        <h1 class="card__title">Iniciar sesión</h1>
        <p class="card__subtitle">Accede con tu correo y tu contraseña.</p>
      </div>

      <div class="alert" id="loginError" role="alert" hidden>Correo o contraseña incorrectos</div>

      <form id="signinForm" class="form" novalidate>
        <div class="field">
          <label class="field__label" for="email">Correo electrónico</label>
          <input class="field__input" id="email" name="email" type="email" autocomplete="email" required>
          <span class="field__error" id="emailError" role="alert" hidden>Introduce un correo válido</span>
        </div>

        <div class="field">
          <label class="field__label" for="password">Contraseña</label>
          <div class="password-row">
            <input class="field__input" id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="btn btn--toggle" id="togglePassword" type="button" aria-label="Mostrar contraseña">Mostrar</button>
          </div>
          <span class="field__error" id="passwordError" role="alert" hidden>Introduce tu contraseña</span>
        </div>

        <button class="btn btn--primary" id="signinButton" type="submit">Entrar</button>
      </form>

      <div class="card__footer">
        <a href="changepassword.html">Cambiar contraseña</a>
        <span>¿No tienes cuenta? <a href="signup.html">Regístrate</a></span>
      </div>
    </section>
  </main>

</body>
</html>
