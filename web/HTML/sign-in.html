<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Sign In and Sign Up Application</title>
  <link rel="stylesheet" href="/Proyecto_Cliente/CSS/styles.css">
</head>
<body>
  <main class="page">
    <div class="card narrow">

      <div class="brand">
        <div class="logo">SA</div>
        <div>
          <span class="brand-name">Sign In and Sign Up Application</span>
          <h1>Bienvenido de nuevo</h1>
        </div>
      </div>

      <nav class="tabs">
        <a href="sign-in.html" class="active">Iniciar sesión</a>
        <a href="sign-up.html">Crear cuenta</a>
      </nav>

      <div id="successMessage" class="message ok" hidden></div>
      <div id="formError" class="message" role="alert" hidden></div>

      <!-- id="loginForm" lo usa el JS; novalidate deja que el JS muestre sus propios errores -->
      <form id="loginForm" action="#" method="post" novalidate>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
          <!-- Botón que usa el JS para mostrar/ocultar la contraseña -->
          <button type="button" id="passwordToggle" aria-pressed="false">Mostrar</button>
        </div>

        <div class="options">
          <label class="check"><input type="checkbox" name="remember"> Recuérdame</label>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- La clase login-btn la busca el JS -->
        <button type="submit" class="btn login-btn">Iniciar sesión</button>

        <div class="footer">¿No tienes cuenta? <a href="sign-up.html">Crea una</a></div>
      </form>
    </div>
  </main>

  <!-- Script cargado como módulo (necesario porque usa import/export) -->
  <script type="module" src="/Proyecto_Cliente/JS/controllerSignIn.js"></script>
</body>
</html>
