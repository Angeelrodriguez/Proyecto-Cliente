<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Codificación de caracteres: permite tildes y la ñ -->
  <meta charset="UTF-8">
  <!-- Hace la página adaptable a móviles (diseño responsive) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Sign In and Sign Up Application</title>
  <!-- Hoja de estilos externa: aquí vive todo el aspecto (CSS), separado del contenido (HTML) -->
  <link rel="stylesheet" href="/Proyecto_Cliente/CSS/styles.css">
</head>
<body>
  <!-- Contenedor principal: centra la tarjeta en la pantalla (.page) -->
  <main class="page">
    <!-- Tarjeta del formulario; "narrow" limita su ancho máximo -->
    <div class="card narrow">

      <!-- Cabecera: logo y título de la aplicación -->
      <div class="brand">
        <div class="logo">SA</div>
        <div>
          <span class="brand-name">Sign In and Sign Up Application</span>
          <h1>Bienvenido de nuevo</h1>
        </div>
      </div>

      <!-- Pestañas de navegación entre Iniciar sesión y Crear cuenta.
           La clase "active" marca la pestaña de la página actual -->
      <nav class="tabs">
        <a href="sign-in.html" class="active">Iniciar sesión</a>
        <a href="sign-up.html">Crear cuenta</a>
      </nav>

      <!-- Formulario de inicio de sesión.
           action="#": de momento no envía a ningún servidor (se gestionará con JS) -->
      <form action="#" method="post">

        <!-- Campo email: type="email" valida el formato y "required" lo hace obligatorio -->
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" required>
        </div>

        <!-- Campo contraseña: type="password" oculta lo que se escribe -->
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <!-- Opciones: casilla "Recuérdame" y enlace de recuperar contraseña (pendiente) -->
        <div class="options">
          <label class="check"><input type="checkbox" name="remember"> Recuérdame</label>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Botón de envío del formulario -->
        <button type="submit" class="btn">Iniciar sesión</button>

        <!-- Enlace de acceso rápido a la página de registro -->
        <div class="footer">¿No tienes cuenta? <a href="sign-up.html">Crea una</a></div>
      </form>
    </div>
  </main>

  <!-- Script de comportamiento (JS), cargado como módulo para poder usar import/export.
       Descomenta esta línea cuando exista JS/sign-in.js:
  <script type="module" src="/Proyecto_Cliente/JS/sign-in.js"></script> -->
</body>
</html>
