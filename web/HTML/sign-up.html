<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Sign In and Sign Up Application</title>
  <link rel="stylesheet" href="/Proyecto_Cliente/CSS/styles.css">
</head>
<body>
  <main class="page">
    <div class="card">
      <div class="brand">
        <div class="logo">SA</div>
        <div>
          <span class="brand-name">Sign In and Sign Up Application</span>
          <h1>Crea tu cuenta</h1>
        </div>
      </div>

      <nav class="tabs">
        <a href="sign-in.html">Iniciar sesión</a>
        <a href="sign-up.html" class="active">Crear cuenta</a>
      </nav>

      <form action="sign-in.html" method="get">
        <div class="section">Datos personales</div>
        <div class="row row-name">
          <div class="field">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" name="firstName" placeholder="Jane" required>
          </div>
          <div class="field">
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
          </div>
          <div class="field">
            <label for="middleInitial">M.I.</label>
            <input type="text" id="middleInitial" name="middleInitial" placeholder="A" maxlength="1" pattern="[A-Za-z]">
          </div>
        </div>

        <div class="section">Dirección</div>
        <div class="field">
          <label for="street">Street</label>
          <input type="text" id="street" name="street" placeholder="123 Main St" required>
        </div>
        <div class="row row-city">
          <div class="field">
            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="Springfield" required>
          </div>
          <div class="field">
            <label for="state">State</label>
            <input type="text" id="state" name="state" placeholder="IL" required>
          </div>
          <div class="field">
            <label for="zip">ZIP</label>
            <input type="text" id="zip" name="zip" placeholder="62701" inputmode="numeric" pattern="[0-9]{5}" title="5 dígitos" required>
          </div>
        </div>

        <div class="section">Cuenta</div>
        <div class="row row-2">
          <div class="field">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" placeholder="5551234567" pattern="[0-9]{7,15}" title="Solo dígitos (7–15)" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="tu@email.com" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Min. 8 caracteres" minlength="8" required>
          </div>
          <div class="field">
            <label for="confirm">Confirmar password</label>
            <input type="password" id="confirm" name="confirm" placeholder="••••••••" minlength="8" required>
          </div>
        </div>

        <label class="check"><input type="checkbox" name="terms" required> Acepto los términos y condiciones</label>
        <button type="submit" class="btn">Crear cuenta</button>
        <div class="footer">¿Ya tienes cuenta? <a href="sign-in.html">Inicia sesión</a></div>
      </form>
    </div>
  </main>
</body>
</html>
